name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fx_board_test
          POSTGRES_USER: fx_board
          POSTGRES_PASSWORD: fx_board
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fx_board -d fx_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fx_board:fx_board@localhost:15432/fx_board_test
      TEST_DATABASE_URL: postgresql+asyncpg://fx_board:fx_board@localhost:15432/fx_board_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Lint backend
        working-directory: backend
        run: uv run --extra dev ruff check .
      - name: Test backend
        working-directory: backend
        run: uv run --extra dev pytest -q

  bot:
    name: Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot dependencies
        working-directory: bot
        run: uv sync --extra dev
      - name: Lint bot
        working-directory: bot
        run: uv run --extra dev ruff check .
      - name: Test bot
        working-directory: bot
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
